name: Refresh CDIP swell field

# Rebuilds the live payloads from THREDDS and deploys the site to Pages as an
# artifact. The payloads deliberately never enter git history: committing
# ~12 MB of gzipped binaries every six hours grew the repo by ~50 MB a day and
# made any fetch after a gap transfer hundreds of MB. The data/ tracked in git
# is a frozen seed so a bare checkout still runs; the page's stale badge
# reports the seed's age honestly.
#
# Code pushes deploy through the same path, reusing the most recently built
# payloads from the Actions cache (at most six hours old, the freshness the
# page promises anyway) instead of spending ~20 minutes against THREDDS for a
# code change. Scheduled runs always rebuild.
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: refresh-swell
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # A clean sweep is ~13 min with the builder's pacing. The budget covers the
    # worst shape instead: a refused sweep (~10 min), the quarter hour the
    # builder waits for the block to clear, and a second sweep that gets through.
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore built payloads
        id: restore
        uses: actions/cache/restore@v4
        with:
          # Only the live payloads build_data.py writes. data/history must
          # come from the checkout, never the cache: a cached copy can predate
          # a just-pushed monthly history refresh and would deploy over it.
          #
          # Restored on every run, not just push deploys. A scheduled run
          # overwrites all of this a minute later, but if CDIP refuses one
          # domain the builder keeps the copy already on disk, and a cached
          # payload at most six hours old is a far better fallback than the
          # frozen seed in git.
          path: |
            data/*.json
            data/*.bin.gz
          key: swell-data-${{ github.run_id }}
          restore-keys: swell-data-

      - uses: actions/setup-python@v5
        if: github.event_name != 'push' || steps.restore.outputs.cache-matched-key == ''
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: github.event_name != 'push' || steps.restore.outputs.cache-matched-key == ''
        run: python -m pip install --quiet netCDF4 numpy scipy

      - name: Check the refusal handling still holds
        if: github.event_name != 'push' || steps.restore.outputs.cache-matched-key == ''
        # Runs in about a second and touches no network. Cheap insurance that
        # the fallback below is real: without it a refusal fails the job, and
        # the failure looks the same either way from the outside.
        run: python build/test_denial.py

      - name: Rebuild payloads from THREDDS
        id: rebuild
        if: github.event_name != 'push' || steps.restore.outputs.cache-matched-key == ''
        # A refusal on some domains leaves those payloads at their previous
        # build and carries on; the page dates each domain from its own time
        # axis, so a stale one announces itself as "stale - N h" without the
        # site going dark.
        #
        # Exit 3 is the builder saying CDIP refused every domain while what is
        # already on disk is still inside its staleness budget. Nothing was
        # rebuilt, so this run deploys the previous payloads unchanged, and it
        # does so green: CDIP blocks this runner a few times a month, the
        # blocks clear on their own, and a payload carries four days of
        # forecast, so one missed cycle is invisible to a visitor. The builder
        # returns 1 once the block has outlasted that budget, which is the case
        # worth a red run.
        run: |
          rc=0
          python build/build_data.py || rc=$?
          if [ "$rc" -eq 3 ]; then
            echo "degraded=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $rc

      - name: Rebuild the coastal sea/swell split
        if: >-
          (github.event_name != 'push' || steps.restore.outputs.cache-matched-key == '')
          && steps.rebuild.outputs.degraded != '1'
        # The fringe is an optional overlay drawn from a different product
        # (the alongshore stations); a THREDDS hiccup here should not abort
        # the field deploy. The fallback is whatever live_bands the checkout
        # or cache already had, whose age the payload's own metadata carries.
        #
        # Skipped outright when the field rebuild came back refused: a block is
        # a property of this runner's address, so the fringe would be refused
        # too, and asking adds requests to whatever CDIP objected to.
        run: |
          python build/build_hindcast.py live --stride 4 \
            || echo "live bands rebuild failed; deploying the previous copy"

      - name: Cache built payloads for push deploys
        if: github.event_name != 'push' || steps.restore.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: |
            data/*.json
            data/*.bin.gz
          key: swell-data-${{ github.run_id }}

      - name: Report any domain left at its previous build
        if: github.event_name != 'push' || steps.restore.outputs.cache-matched-key == ''
        env:
          DEGRADED: ${{ steps.rebuild.outputs.degraded }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          if os.environ.get("DEGRADED") == "1":
              # index.json still describes the last build that actually ran, so
              # it has nothing to say about this one; do not read staleness out
              # of it here.
              print("**Refused.** CDIP refused every domain from this runner, so "
                    "nothing was rebuilt and the previous payloads deploy "
                    "unchanged. See the rebuild step for their age.")
              raise SystemExit(0)
          p = pathlib.Path("data/index.json")
          stale = json.loads(p.read_text()).get("stale", []) if p.exists() else []
          if stale:
              # Usually a CDIP refusal, but any build failure lands here, so do
              # not name a cause the index does not actually record.
              print(f"**Degraded refresh.** {len(stale)} domain(s) could not be "
                    f"rebuilt and were deployed at their previous build: "
                    f"`{' '.join(stale)}`. See the rebuild step for why.")
          else:
              print("All domains rebuilt from THREDDS.")
          PY

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html history.html app.js history.js _site/
          cp -R data _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
