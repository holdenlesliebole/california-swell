name: Refresh CDIP swell field

# The page advertises a rolling ~22-hour window (about six hours of nowcast
# behind the present and sixteen of forecast ahead). Without a scheduled
# rebuild it silently becomes a snapshot of whenever it was last built, which
# is worse than not claiming to be live at all. Every six hours keeps the
# displayed window always straddling the present.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

# Least privilege: this job only needs to push the regenerated payload.
permissions:
  contents: write

concurrency:
  group: refresh-swell
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet netCDF4 numpy scipy

      - name: Rebuild payloads from THREDDS
        run: python build/build_data.py

      - name: Commit if the data changed
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          # index.json and the metas always contain a fresh `generated`
          # timestamp, so "did anything change" has to be judged on the actual
          # field payloads -- otherwise this commits an empty diff every run.
          if git diff --cached --quiet -- data/ca.bin.gz data/sd.bin.gz; then
            echo "Fields unchanged since last run; skipping commit."
            git reset
          else
            git commit -m "Refresh CDIP swell field payloads"
            git push
          fi
