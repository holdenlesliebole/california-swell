name: Refresh swell history (current year)

# The hindcast itself is fixed and never needs rebuilding, but the alongshore
# *nowcast* keeps growing, so the current year's overview file stops short of
# the present the moment it is built. Rebuilding just that one year each month
# keeps the record running up to today without touching the other 25.
on:
  schedule:
    - cron: '40 6 1 * *'
  workflow_dispatch:
    inputs:
      years:
        description: 'Year range to rebuild, e.g. 2024-2026'
        required: false

permissions:
  contents: write
  # To kick the deploy workflow after committing new history payloads.
  actions: write

concurrency:
  group: refresh-swell-history
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # A single year is ~1450 sites of THREDDS round-trips; give it room.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet netCDF4 numpy scipy

      - name: Rebuild the current year
        run: |
          YEARS="${{ github.event.inputs.years }}"
          if [ -z "$YEARS" ]; then
            Y=$(date -u +%Y); YEARS="$Y-$Y"
          fi
          echo "Rebuilding $YEARS"
          # Drop the existing file first: the builder skips years it has
          # already produced, which is what makes long runs resumable.
          for y in $(seq ${YEARS%-*} ${YEARS#*-}); do
            rm -f "data/history/overview/$y.json" \
                  "data/history/overview/$y.bin.gz"
          done
          python build/build_hindcast.py overview --years "$YEARS" --stride 8

      - name: Commit if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet -- 'data/history/overview/*.bin.gz'; then
            echo "No change to the field payloads; skipping commit."
            git reset
          else
            git commit -m "Refresh swell history overview (current year)"
            git push
            # A push made with GITHUB_TOKEN does not fire push-triggered
            # workflows (recursion guard), so kick the deploy explicitly.
            # Not load-bearing: if this fails, the next six-hour refresh
            # ships the new files anyway.
            gh workflow run refresh-swell.yml --ref main \
              || echo "dispatch failed; next scheduled refresh will deploy"
          fi
